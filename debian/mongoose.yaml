configuration:
  database_path: "/var/lib/mongoose/mongoose.db"
  extra_configuration_dir: "/var/lib/mongoose/"

  history:
    max_duration_days: 14

  collector:
    suricata:
      socket_path: "/run/suricata.socket"  # unix_dgram
      collect_alerts: true
      collect_netflow: false
      enable: true

    nf_stream:
      interface: "eth0"
      active_timeout: 60  # 60 seconds
      max_nflows: 0
      enable: true

  enrichment:
    geoip:
      maxmind_db_path: "/var/lib/GeoIP"
      maxmind_db:
        "GeoLite2-ASN.mmdb"
        "GeoLite2-City.mmdb"
        "GeoLite2-Country.mmdb"
      enable: true

  forwarder:
    file:  # grows indefinitely
      output_dir: /var/log/mongoose
      topics: [ "enriched-network-dpi", "enriched-network-alert" ]
      prefix: mongoose-
      enable: false

    discord:
      - url: https://discord.com/api/webhooks/...
        username: mongoose-bot
        avatar_url: https://example.org/avatar.png
        allowed_mentions:
          parse: [ ]
        enable: false

    webhooks:
      - url: https://example.org/hook
        headers:
          X-API-Key: secret
        auth_type: header
        auth_token: s3cr3t
        auth_header_name: X-API-Key
        verify_ssl: true
        retry_count: 3
        retry_delay: 5.0
        timeout: 10.0
        topics: ["enriched-network-dpi", "enriched-network-alert"]
        enable: false
