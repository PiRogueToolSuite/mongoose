configuration:
  collector:
    suricata:
      socket_path: "/run/suricata.socket"
      disable: true

    nf_stream:
      active_timeout: 0
      interface: "en11"
      max_nflows: 5
      disable: false

  enrichment:
    geoip:
      remote_service_url: "https://example.org/"
      disable: false

  forwarder:
    file:
      output_dir: "output"
      prefix: "mongoose-"
      topics:
        - "enriched-network-dpi"
        - "enriched-network-alert"
        - "enriched-network-flow"
      disable: true

    webhooks:
      - webhook:
          url: "https://hooks.example.com/ingest"
          headers:
            Content-Type: "application/json"
            X-Custom-Header: "custom-value"
          auth_type: "bearer"
          auth_token: "${WEBHOOK_AUTH_TOKEN}"
          auth_header_name: "X-API-Key"
          verify_ssl: true
          retry_count: 3
          retry_delay: 5.0
          timeout: 10.0
          disable: true
          topics:
            - "enriched-network-dpi"
            - "enriched-network-alert"
          mode: "immediate"
          bulk_size: 10
          periodic_interval: 5.0
          periodic_rate: 10
