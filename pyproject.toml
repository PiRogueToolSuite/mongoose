[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pirogue-mongoose"
version = "1.0.1"
description = "A Python daemon and library for collecting, enriching, storing and forwarding network events from Suricata and NFStream."
readme = "README.md"
license = "GPL-3.0-or-later"
maintainers = [
  { name = "U+039b", email = "hello@pts-project.org" },
]
authors = [
  { name = "U+039b", email = "hello@pts-project.org" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "communityid==1.4",
  "geoip2==2.9",
  "nfstream==6.5.4",
  "pydantic==1.10.4",
  "pyyaml>=6.0.3",
  "requests==2.28.1",
  "sqlalchemy==1.4.46",
  "watchdog==2.2.1",
]

urls.discord = "https://discord.gg/qGX73GYNdp"
urls.documentation = "https://pts-project.org/mongoose/"
urls.donate = "https://opencollective.com/pts"
urls.homepage = "https://pts-project.org"
urls.issues = "https://github.com/PiRogueToolSuite/mongoose/issues"
urls.mastodon = "https://infosec.exchange/@pts"
urls.repository = "https://github.com/PiRogueToolSuite/mongoose"

scripts.mongoosed = "mongoose.entrypoints.cmd:main_cli"

[dependency-groups]
dev = [
  "hatchling",
  "mypy",
  "pre-commit-uv",
  "pytest",
  "reuse",
  "ruff",
  "tox",
  "tox-uv",
]
test = [
  "coverage",
  "hatchling",
  "mypy",
  "pytest",
  "pytest-cov",
  "pytest-md-report",
  "sphinx",
]
docs = [
  "autoclasstoc",
  "myst-parser",
  "sphinx",
  "sphinx-autobuild",
  "sphinxcontrib-mermaid",
  "sphinx-copybutton",
  "sphinx-hoverxref",
  "sphinx-jsonschema",
  "sphinx-needs",
  "sphinx-notfound-page",
  "sphinx-pydantic",
  "sphinx-rtd-theme",
  "sphinx-sqlalchemy",
  "sphinx-toolbox",
  "sphinxcontrib-datatemplates",
  "sphinxcontrib-mermaid",
]

[tool.hatch]
build.targets.sdist.ignore-vcs = true
build.targets.sdist.only-include = [
  "mongoose",
  "LICENSE",
  "README.md",
]
build.targets.wheel.packages = [ "mongoose" ]

[tool.uv]
concurrent-builds = 4
trusted-publishing = "always"

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
exclude = [
  ".eggs",
  ".git",
  ".idea",
  ".ruff_cache",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "build",
  "dist",
  "site-packages",
]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = false
lint.select = [ "E4", "E7", "E9", "F" ]
lint.ignore = [ "E722", "F401", "F403", "F405", "F841" ]
lint.fixable = [ "ALL" ]
lint.unfixable = []
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.pytest]
addopts = [ "-ra", "-q" ]
testpaths = [
  "tests",
]

[tool.coverage]
run.omit = [
  "*test_*",
  "docs/*",
  "trash/*",
]
report.omit = [
  "*test_*",
  "docs/*",
  "trash/*",
]

[tool.bandit]
targets = [ "mongoose" ]
exclude_dirs = [ "tests", "doc" ]
skips = [ "B101" ]
