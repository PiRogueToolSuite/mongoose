[build-system]
build-backend = "hatchling.build"

requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "mongoose"
description = "Helpers to collect, enrich and store Suricata events and network flows."
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
maintainers = [
  { name = "U+039b", email = "hello@pts-project.org" },
]
authors = [
  { name = "U+039b", email = "hello@pts-project.org" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
    "communityid==1.4",
    "nfstream==6.5.4",
    "pydantic==1.10.4",
    "sqlalchemy==1.4.46",
    "requests==2.28.1",
]

[dependency-groups]
dev = [
  "hatchling",
  "mypy",
  "pre-commit-uv",
  "pytest",
  "ruff",
  "tox",
  "tox-uv",
  "uv-dynamic-versioning",
]
test = [
  "coverage",
  "hatchling",
  "mypy",
  "pytest",
  "pytest-cov",
  "pytest-md-report",
  "sphinx",
]

docs = [
  "autoclasstoc",
  "docutils-stubs",
  "myst-parser",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-copybutton",
  "sphinx-hoverxref",
  "sphinx-jsonschema",
  "sphinx-needs",
  "sphinx-notfound-page",
  "sphinx-rtd-theme",
  "sphinx-toolbox",
  "sphinxcontrib-datatemplates",
  "types-docutils",
]

[tool.hatch.build.targets.sdist]
ignore-vcs = true
only-include = [
  "mongoose",
  "LICENSE",
  "README.md",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4
exclude = [
  ".eggs",
  ".git",
  ".idea",
  ".ruff_cache",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "build",
  "dist",
  "site-packages",
]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
format.docstring-code-line-length = "dynamic"
format.docstring-code-format = false
lint.select = [ "E4", "E7", "E9", "F" ]
lint.ignore = [ "E722", "F403", "F405", "F841" ]
lint.fixable = [ "ALL" ]
lint.unfixable = [  ]
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
